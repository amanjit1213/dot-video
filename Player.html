<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="screen-orientation" content="landscape">
<title>Dot Video Player</title>
<link rel="stylesheet" href="Player.css">
<script src="supabase-config.js"></script>
</head>

<body>

<header id="pageHeader">
  <button id="backBtn" aria-label="Back">‹</button>
  <div class="logo">Dot Video<span>.</span></div>
  <button id="homeBtn" aria-label="Home">⌂</button>
</header>

<main>

  <div class="player-wrap" id="playerWrap">

    <video
      id="videoPlayer"
      playsinline
      webkit-playsinline
      preload="metadata">
    </video>

    <div id="noVideo" class="no-video">
      Loading video...
    </div>

    <button id="centerPlayBtn" class="center-play" aria-label="Play video">
      ▶
    </button>

    <div id="controls" class="controls">

      <div class="control-row">

        <button id="playPauseBtn"
          class="control-btn"
          aria-label="Play">
          ▶
        </button>

        <button id="back10Btn"
          class="control-btn skip-btn"
          aria-label="Back 10 seconds"
          title="Back 10 seconds">

          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="27"></circle>
            <path d="M39 20 25 32l14 12M31 20 17 32l14 12"></path>
          </svg>

          <span>10</span>
        </button>

        <button id="forward10Btn"
          class="control-btn skip-btn"
          aria-label="Forward 10 seconds"
          title="Forward 10 seconds">

          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="27"></circle>
            <path d="m25 20 14 12-14 12m8-24 14 12-14 12"></path>
          </svg>

          <span>10</span>
        </button>

        <div class="time">
          <span id="currentTime">0:00</span>
          /
          <span id="duration">0:00</span>
        </div>

        <div class="spacer"></div>

        <button id="muteBtn"
          class="control-btn icon-svg-btn"
          aria-label="Mute"
          title="Mute">

          <svg class="volume-icon"
            viewBox="0 0 64 64"
            aria-hidden="true">

            <path d="M9 25h12l15-13v40L21 39H9z"></path>
            <path d="m47 25 10 10m0-10L47 35"></path>

          </svg>
        </button>

        <button id="fullscreenBtn"
          class="control-btn icon-svg-btn"
          aria-label="Full screen"
          title="Full screen">

          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M9 25V11h14M55 25V11H41M9 39v14h14M55 39v14H41"></path>
          </svg>

        </button>

        <button id="rotateBtn"
          class="control-btn rotate-btn"
          aria-label="Rotate screen"
          title="Rotate screen">

          <svg viewBox="0 0 64 64" aria-hidden="true">

            <rect
              x="22"
              y="18"
              width="20"
              height="28"
              rx="2">
            </rect>

            <path d="M12 23c4-7 10-11 18-11"></path>
            <path d="M52 41c-4 7-10 11-18 11"></path>

            <path d="m13 14 0 9 9-2"></path>
            <path d="m51 50v-9l-9 2"></path>

          </svg>

        </button>

        <button id="moreBtn"
          class="control-btn"
          aria-label="More options">
          ⋮
        </button>

      </div>

      <input
        id="progress"
        class="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="Video progress">

    </div>

    <div id="moreMenu" class="more-menu" hidden>

      <div class="menu-title">
        Playback speed
      </div>

      <button data-speed="0.5">0.5×</button>
      <button data-speed="1">1×</button>
      <button data-speed="1.25">1.25×</button>
      <button data-speed="1.5">1.5×</button>
      <button data-speed="2">2×</button>

    </div>

  </div>

  <section class="details">

    <h1 id="title">Dot Video</h1>

    <p id="description"></p>

    <div class="action-row">

      <div class="views">
        <span id="viewsCount">0 views</span>
      </div>

      <button
        id="likeBtn"
        class="action-btn like-btn"
        aria-label="Like video">

        <span
          class="action-icon heart-icon"
          aria-hidden="true">

          <svg viewBox="0 0 64 64">
            <path d="M32 53S9 39 9 23C9 14 15 9 23 9c5 0 8 3 9 6 1-3 4-6 9-6 8 0 14 5 14 14 0 16-23 30-23 30z"></path>
          </svg>

        </span>

        <span id="likesCount">0</span>

      </button>

      <button
        id="shareBtn"
        class="action-btn icon-btn"
        aria-label="Share video"
        title="Share">

        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="14" cy="32" r="7"></circle>
          <circle cx="49" cy="14" r="7"></circle>
          <circle cx="49" cy="50" r="7"></circle>
          <path d="m20 29 22-11M20 35l22 11"></path>
        </svg>

      </button>

      <button
        id="downloadBtn"
        class="action-btn icon-btn"
        aria-label="Download video"
        title="Download">

        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 8v31M19 27l13 13 13-13M11 47v9h42v-9"></path>
        </svg>

      </button>

    </div>

    <div
      id="message"
      class="player-message"
      aria-live="polite">
    </div>

    <div
      id="likeMessage"
      class="like-message"
      aria-live="polite">
    </div>

  </section>

  <section class="more-videos-section">

    <div class="section-heading">

      <div>

        <h2>New Videos</h2>

        <p>
          Recently uploaded on Dot Video
        </p>

      </div>

    </div>

    <div id="newVideos" class="new-video-grid">

      <div class="loading-card">
        Loading...
      </div>

    </div>

  </section>

</main>

<script src="Player.js"></script>

</body>
</html>
