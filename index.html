<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dot Video</title>

  <!-- Home Page CSS -->
  <link
    rel="stylesheet"
    href="Dot Video.css"
  >

  <!-- Supabase Configuration -->
  <script src="supabase-config.js"></script>

</head>


<body>


  <!-- =========================================
       HEADER
       ========================================= -->

  <header>

    <div>

      <div class="logo">
        Dot Video<span>.</span>
      </div>

      <div class="tagline">
        Watch. Enjoy. Anytime.
      </div>

    </div>


    <button
      id="menuBtn"
      aria-label="Menu"
    >
      ☰
    </button>

  </header>



  <!-- =========================================
       MAIN
       ========================================= -->

  <main>


    <!-- =======================================
         HERO
         ======================================= -->

    <section class="hero">

      <p>
        WELCOME TO DOT VIDEO
      </p>


      <h1>
        Find <span>Your Next</span> Video
      </h1>


      <!-- SEARCH -->

      <div class="search-box">

        <span class="search-icon">
          🔍
        </span>


        <input
          id="searchInput"
          type="search"
          placeholder="Search Desi Videos, English Movies..."
          autocomplete="off"
        >


        <button id="searchBtn">
          Search
        </button>

      </div>

    </section>



    <!-- =======================================
         SEARCH RESULTS
         ======================================= -->

    <section
      id="searchSection"
      class="search-section hidden"
    >

      <div class="section-title">

        <div>

          <h2>
            Search Results
          </h2>

        </div>


        <button id="clearSearch">
          Clear
        </button>

      </div>


      <div
        id="searchResults"
        class="poster-grid"
      ></div>

    </section>



    <!-- =======================================
         DESI VIDEOS
         ======================================= -->

    <section class="video-section">

      <div class="section-title">

        <div>

          <div class="section-icon">
            🎥
          </div>


          <div>

            <h2>
              Desi Videos
            </h2>


            <p>
              Punjabi, Hindi & more
            </p>

          </div>

        </div>


        <button
          class="view-all"
          onclick="location.href='Desi Videos.html'"
        >
          View All ›
        </button>

      </div>


      <div
        id="desiResults"
        class="poster-grid"
      >

        <div class="loading">
          Loading...
        </div>

      </div>

    </section>



    <!-- =======================================
         ENGLISH MOVIES
         ======================================= -->

    <section class="video-section">

      <div class="section-title">

        <div>

          <div class="section-icon">
            🎬
          </div>


          <div>

            <h2>
              English Movies
            </h2>


            <p>
              English movies & videos
            </p>

          </div>

        </div>


        <button
          class="view-all"
          onclick="location.href='English Movies.html'"
        >
          View All ›
        </button>

      </div>


      <div
        id="englishResults"
        class="poster-grid"
      >

        <div class="loading">
          Loading...
        </div>

      </div>

    </section>


  </main>



  <!-- =========================================
       MENU
       ========================================= -->

  <nav
    id="menu"
    class="menu hidden"
    aria-label="Main menu"
  >


    <button
      id="closeMenu"
      aria-label="Close menu"
    >
      ×
    </button>


    <h2>
      Menu
    </h2>


    <button
      onclick="location.href='index.html'"
    >
      🏠 Home
    </button>


    <button
      onclick="location.href='Desi Videos.html'"
    >
      🎥 Desi Videos
    </button>


    <button
      onclick="location.href='English Movies.html'"
    >
      🎬 English Movies
    </button>


    <button
      onclick="location.href='Admin Login.html'"
    >
      ⚙️ Admin
    </button>


  </nav>



  <!-- =========================================
       HOME PAGE JAVASCRIPT
       ========================================= -->

  <script src="Dot Video.js"></script>


</body>

</html>
