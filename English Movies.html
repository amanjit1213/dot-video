<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Movies - Dot Video.</title>
  <link rel="stylesheet" href="English Movies.css">
  <script src="supabase-config.js"></script>
</head>

<body>

<header class="topbar">

  <a class="brand" href="index.html">
    Dot Video<span>.</span>
  </a>

  <button
    id="menuBtn"
    class="menu-btn"
    aria-label="Open menu">
    ☰
  </button>

</header>


<!-- MENU -->

<aside
  id="menuPanel"
  class="menu-panel"
  aria-hidden="true">

  <div class="menu-head">

    <div class="menu-title">
      Menu
    </div>

    <button
      id="closeMenu"
      class="close-btn"
      aria-label="Close menu">
      ×
    </button>

  </div>


  <nav class="menu-links">

    <!-- HOME -->
    <a href="index.html">
      🏠 <span>Home</span>
    </a>


    <!-- DESI VIDEOS -->
    <a href="Desi Videos.html">
      🎥 <span>Desi Videos</span>
    </a>


    <!-- ENGLISH MOVIES -->
    <a
      class="active"
      href="English Movies.html">
      🎬 <span>English Movies</span>
    </a>

  </nav>

</aside>


<!-- MENU OVERLAY -->

<div
  id="menuOverlay"
  class="menu-overlay">
</div>


<main class="page">


  <!-- HERO -->

  <section class="hero">

    <div class="eyebrow">
      WELCOME TO DOT VIDEO
    </div>


    <h1>
      Find
      <span>Your English</span>
      Movies
    </h1>


    <!-- SEARCH -->

    <form
      id="searchForm"
      class="search-box">

      <span class="search-icon">
        ⌕
      </span>


      <input
        id="searchInput"
        type="search"
        placeholder="English Movies"
        autocomplete="off"
      >


      <button type="submit">
        Search
      </button>

    </form>

  </section>


  <!-- ENGLISH MOVIES TITLE -->

  <section class="section-head">

    <div class="section-icon">
      🎬
    </div>


    <div>

      <h2>
        English Movies
      </h2>

      <p>
        English movies &amp; videos
      </p>

    </div>

  </section>


  <!-- STATUS -->

  <div
    id="status"
    class="status">

    Loading English Movies...

  </div>


  <!-- VIDEO GRID -->

  <section
    id="videoGrid"
    class="video-grid">
  </section>


</main>


<script src="English Movies.js"></script>

</body>
</html>
