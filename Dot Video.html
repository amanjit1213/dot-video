<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dot Video</title>

<link rel="stylesheet" href="Dot Video.css">
<script src="supabase-config.js"></script>
</head>

<body>

<header>
  <div>
    <div class="logo">Dot Video<span>.</span></div>
    <div class="tagline">Watch. Enjoy. Anytime.</div>
  </div>

  <button id="menuBtn" aria-label="Menu">☰</button>
</header>


<main>

  <!-- HERO -->
  <section class="hero">

    <p>WELCOME TO DOT VIDEO</p>

    <h1>
      Find <span>Your Next</span> Video
    </h1>

    <!-- SEARCH -->
    <div class="search-box">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        placeholder="Search Desi Videos, English Movies..."
      >

      <button id="searchBtn">
        Search
      </button>

    </div>

  </section>


  <!-- SEARCH RESULTS -->
  <section
    id="searchSection"
    class="search-section hidden"
  >

    <div class="section-title">

      <h2>Search Results</h2>

      <button id="clearSearch">
        Clear
      </button>

    </div>

    <div
      id="searchResults"
      class="poster-grid"
    ></div>

    <p id="searchStatus"></p>

  </section>


  <!-- DESI VIDEOS -->
  <section class="video-section">

    <div class="section-heading">

      <div class="heading-left">

        <div class="category-icon video-icon">
          ●
        </div>

        <div>
          <h2>Desi Videos</h2>
          <p>Punjabi, Hindi & more</p>
        </div>

      </div>


      <button
        class="view-all"
        onclick="location.href='Desi Videos.html'"
      >
        View All ›
      </button>

    </div>


    <div
      id="desiList"
      class="poster-grid"
    >

      <p class="loading">
        Loading...
      </p>

    </div>

  </section>


  <!-- ENGLISH MOVIES -->
  <section class="video-section">

    <div class="section-heading">

      <div class="heading-left">

        <div class="category-icon movie-icon">
          🎬
        </div>

        <div>
          <h2>English Movies</h2>
          <p>English movies & videos</p>
        </div>

      </div>


      <button
        class="view-all"
        onclick="location.href='English Movies.html'"
      >
        View All ›
      </button>

    </div>


    <div
      id="englishList"
      class="poster-grid"
    >

      <p class="loading">
        Loading...
      </p>

    </div>

  </section>

</main>


<!-- MENU -->
<nav
  id="menu"
  class="menu hidden"
>

  <button
    id="closeMenu"
    class="close-menu"
  >
    ×
  </button>


  <h2>Menu</h2>


  <button
    onclick="location.href='Dot Video.html'"
  >
    🏠 Home
  </button>


  <button
    onclick="location.href='Desi Videos.html'"
  >
    🎥 Desi Videos
  </button>


  <button
    onclick="location.href='English Movies.html'"
  >
    🎬 English Movies
  </button>


  <button
    onclick="location.href='Admin Login.html'"
  >
    🔐 Admin
  </button>

</nav>


<script>

const menu =
  document.getElementById("menu");

const menuBtn =
  document.getElementById("menuBtn");

const closeMenu =
  document.getElementById("closeMenu");


menuBtn.onclick = () => {

  menu.classList.remove("hidden");

};


closeMenu.onclick = () => {

  menu.classList.add("hidden");

};



/* SUPABASE */

const {
  url,
  publishableKey
} = window.DOT_VIDEO_SUPABASE;



const desiList =
  document.getElementById("desiList");

const englishList =
  document.getElementById("englishList");



/* SEARCH */

const searchInput =
  document.getElementById("searchInput");

const searchBtn =
  document.getElementById("searchBtn");

const searchSection =
  document.getElementById("searchSection");

const searchResults =
  document.getElementById("searchResults");

const searchStatus =
  document.getElementById("searchStatus");

const clearSearch =
  document.getElementById("clearSearch");



let allVideos = [];



/* LOAD VIDEOS */

async function loadVideos() {

  try {

    const endpoint =
      `${url}/rest/v1/videos?select=id,title,category,description,poster_url,video_url,published,created_at&published=eq.true&order=created_at.desc`;


    const response =
      await fetch(endpoint, {

        headers: {

          apikey: publishableKey,

          Authorization:
            `Bearer ${publishableKey}`,

          Accept: "application/json"

        }

      });


    if (!response.ok) {

      throw new Error(
        "Database request failed"
      );

    }


    allVideos =
      await response.json();


    /* DESI - LATEST 3 */

    const desiVideos =
      allVideos
        .filter(video =>
          video.category === "desi" ||
          video.category === "Desi Videos"
        )
