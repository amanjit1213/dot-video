<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dot Video Admin Panel</title><link rel="stylesheet" href="Admin Panel.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><header><b>Dot Video Admin Panel</b><button id="logout">Logout</button></header><main><div class="box"><h2>Add video/movie</h2><input id="title" placeholder="Title"><select id="category"><option value="desi">Desi Videos</option><option value="english">English Movies</option></select><textarea id="description" placeholder="Description"></textarea><div class="row"><div class="upload-box"><label for="poster">Poster Image</label><span class="hint">Choose poster/thumbnail</span><input id="poster" type="file" accept="image/*"><img id="posterPreview" class="preview" alt="Poster preview"></div><div class="upload-box"><label for="video">Video File</label><span class="hint">Choose video/movie</span><input id="video" type="file" accept="video/*"><span id="videoInfo" class="hint"></span></div></div><button id="save">Upload &amp; Save</button>
<div id="uploadProgress" class="upload-progress" hidden aria-live="polite">
  <div class="upload-progress-top"><span id="uploadProgressText">Uploading 0%</span><span id="uploadProgressSize"></span></div>
  <div class="upload-progress-track"><div id="uploadProgressBar" class="upload-progress-bar"></div></div>
</div>
<p id="msg"></p></div><div class="box"><h2>Content</h2><div id="items">Loading...</div></div></main><script src="Admin Panel.js"></script></body></html>
